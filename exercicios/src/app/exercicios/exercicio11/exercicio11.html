<h2>{{ produto }}</h2><p>Preço: R$ {{ preco }}</p><p>Quantidade: {{ quantidade }}</p><button (click)="diminuir()" [disabled]="quantidade === 1">-</button><button (click)="aumentar()">+</button><p>Total: R$ {{ preco * quantidade }}</p><button (click)="adicionar()">Adicionar ao carrinho</button><p>{{ mensagem }}</p>
