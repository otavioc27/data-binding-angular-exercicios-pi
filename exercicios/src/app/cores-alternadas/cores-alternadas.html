<h2>Disciplinas</h2>

<ul>
  <li
    *ngFor="let disciplina of disciplinas; let primeiro = first; let ultimo = last; let par = even; let impar = odd"
    [ngClass]="{
      'fundo-par': par,
      'fundo-impar': impar,
      'primeiro': primeiro,
      'ultimo': ultimo
    }"
  >
    {{ disciplina }}
  </li>
</ul>
